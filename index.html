<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宇宙玻璃 Studio 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;font-size:14px}[hidden]{display:none!important}
/* Layout: full-screen 3D stage; controls float over it — style tabs on top, views bottom-left, notes bottom-right. Single dark look by choice. */
:root{
  color-scheme:dark;
  --ink:#0A0C12; --panel:rgba(14,17,26,.82); --line:#39425C; --fg:#ECEEF5; --dim:#A9B1C8;
  --pick:#FF9A4D; --pick-ink:#1A1206; --focus:#7FD6FF;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--sans);overflow:hidden;display:flex;flex-direction:column}
#stage{position:relative;width:100%;flex:1;min-height:0}
#planwrap{position:relative;flex:none;height:clamp(150px,36vh,420px);border-top:1px solid var(--line);background:#0D1018;padding:6px 16px}
#plan{width:100%;height:100%;display:block;touch-action:manipulation}
#t-img{position:absolute;right:16px;top:8px;background:var(--panel);color:var(--dim);border-color:var(--line);font-size:12.5px;font-weight:400;min-height:34px;padding:6px 10px}
#t-img[aria-pressed="true"]{color:var(--fg);border-color:var(--pick)}
#pl-img{opacity:.4;filter:invert(1)}
#plan .rm{fill:none;stroke:var(--fg);stroke-width:.07}
#plan .bal{fill:none;stroke:var(--dim);stroke-width:.03;stroke-dasharray:.12}
#plan .zb{fill:var(--pick);fill-opacity:0;cursor:crosshair}
#plan .zb.on{fill-opacity:.12}
#plan .it{fill:#2A3145;stroke:#8E9AB8;stroke-width:.025}
#plan .it.dp{fill:#3A3470;stroke:#A99BFF}
#plan .it.hot{fill:var(--pick);stroke:var(--pick)}
#plan .it:hover{stroke:var(--focus);stroke-width:.06}
#plan .gl{stroke:#7FD6FF;stroke-width:.06}
#plan .sc{stroke:#C29E72;stroke-width:.08}
#plan .ex{fill:#E0463E}
#plan .zt{fill:#161B28;stroke:var(--line);stroke-width:.02;cursor:pointer}
#plan .zt:hover{stroke:var(--focus);stroke-width:.04}
#plan .zt.on{fill:var(--pick);stroke:var(--pick)}
#plan .zl{font-size:.21px;fill:var(--fg);text-anchor:middle;pointer-events:none;font-family:var(--sans)}
#plan .zt.on + .zl{fill:var(--pick-ink);font-weight:700}
#plan .tx{font-size:.15px;fill:var(--fg);text-anchor:middle;pointer-events:none;font-family:var(--sans);paint-order:stroke;stroke:#0D1018;stroke-width:.045}
#plan .cone{fill:var(--focus);fill-opacity:.3}
#plan .camdot{fill:var(--focus);stroke:#fff;stroke-width:.03}
.lb.on{background:var(--focus);color:#06131C;border-color:var(--focus);font-weight:700;z-index:2}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);padding:2px 7px;border-radius:3px;background:rgba(10,12,18,.78);color:var(--fg);font-size:12px;white-space:nowrap;border:1px solid var(--line)}
.lb.hot{background:var(--pick);color:var(--pick-ink);border-color:var(--pick);font-weight:700}
.bar{position:absolute;left:0;right:0;display:flex;flex-wrap:wrap;gap:10px;padding-inline:16px;pointer-events:none}
.bar>*{pointer-events:auto}
#top{top:0;padding-block:14px 0;align-items:center;justify-content:space-between}
#bottom{bottom:0;padding-block:0 14px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 6px #000}
.grp{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px)}
button{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:9px 13px;min-height:40px;cursor:pointer}
button:hover{border-color:var(--line)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button[aria-pressed="true"]{background:var(--pick);color:var(--pick-ink);font-weight:700}
#note{max-width:380px;min-width:0;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:6px}
#note h2{margin:0;font-family:var(--serif);font-size:22px}
#note p{margin:0;font-size:13.5px;line-height:1.7;color:var(--dim)}
#note p b{color:var(--fg);font-weight:500}
#hint{font-size:12px;color:var(--dim);text-shadow:0 1px 4px #000}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;line-height:1.8}
@media (max-width:640px){
  h1{font-size:16px;width:100%}
  button{padding:8px 10px;font-size:13px}
  #note{max-width:none;width:100%;padding:10px 12px}
  #note h2{font-size:18px}
  #note p{font-size:12.5px;line-height:1.55}
  #plan .tx{display:none}
  #plan .zl{font-size:.34px}
  #planwrap{height:auto;padding-block:4px}
  #plan{height:auto;aspect-ratio:15/5.8}
  #t-img{display:none}
  .lb{font-size:10.5px;padding:1px 5px}
}
</style>
</head>

<div id="stage">
  <canvas id="gl" aria-label="Studio 立體模型，可拖動旋轉"></canvas>

  <div class="bar" id="top">
    <h1>宇宙玻璃 Studio・3D</h1>
    <div class="grp" role="group" aria-label="風格">
      <button id="s-A" data-s="A" aria-pressed="true">A 暗宇宙</button>
      <button id="s-B" data-s="B" aria-pressed="false">B 實驗室</button>
      <button id="s-C" data-s="C" aria-pressed="false">C 侘寂茶室</button>
      <button id="s-D" data-s="D" aria-pressed="false">D 工業工坊</button>
    </div>
  </div>
  <div class="bar" id="bottom">
    <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
      <div id="hint">拖動旋轉・滾輪或雙指縮放・㩒下面平面圖或分區，3D 會跟住移</div>
      <div class="grp" role="group" aria-label="視角">
        <button id="v-bird" data-v="bird" aria-pressed="true">鳥瞰</button>
        <button id="v-door" data-v="door" aria-pressed="false">入口</button>
        <button id="v-top" data-v="top" aria-pressed="false">平面</button>
        <button id="t-lab" aria-pressed="true">標籤</button>
      </div>
    </div>
    <div id="note"><h2 id="n-t"></h2><p id="n-d"></p><p id="n-m"></p></div>
  </div>
  <div id="err" hidden>3D 元件載入唔到。請重新整理頁面，或者換一個瀏覽器再開。</div>
</div>
<div id="planwrap">

  <button id="t-img" aria-pressed="true">原平面圖</button>
</div>

var plan=document.getElementById('plan'),zone=-1,zoneMesh=null,camStr='',showImg=true;
function PR(x,z,w,d,cls,extra){return '<rect x="'+x+'" y="'+z+'" width="'+w+'" height="'+d+'" class="'+cls+'"'+(extra||'')+'/>';}
function drawPlan(key){

    var t=i.l?' data-l="'+i.l+'"':'',c=i.hot?'it hot':(i.k==='case'||i.k==='shelf'||i.k==='ped'||i.k==='cart')?'it dp':'it';

function resize(){var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
var v3=new THREE.Vector3();
function frame(now){
  requestAnimationFrame(frame);
  if(tw){var u=Math.min(1,(now-tw.s)/700),e=u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;camera.position.lerpVectors(tw.p0,tw.p1,e);controls.target.lerpVectors(tw.t0,tw.t1,e);if(u>=1)tw=null;}
  controls.update();renderer.render(scene,camera);syncPlan();
  var w=stage.clientWidth,h=stage.clientHeight;

    var vis=showLabels&&v3.z<1&&v3.x>-1.1&&v3.x<1.1&&v3.y>-1.1&&v3.y<1.1;

resize();build('A');go('bird',true);requestAnimationFrame(frame);
})();
